[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agents-gateway"
version = "0.1.0"
description = "A toy multi-agent router and the eval harness used to check that it routes safely."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["router", "evals"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval_golden: mocked golden scenarios run through the production run() path (no LLM needed)",
    "eval_redteam: deterministic untrusted-agent red team, replayed at three guard levels (no LLM needed)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
