name: ci

# Runs on every PR. Nothing here needs a model server: the planner is scripted
# and the agents are in-process, so the golden pack is fast and deterministic.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Golden scenarios (run() path, no LLM)
        run: pytest -m eval_golden -q

      - name: Untrusted-agent red team (attack success rate vs ceilings)
        run: pytest -m eval_redteam -q

      - name: Everything else (unit tests, dataset lint, eval-scoring tests)
        run: pytest -q -m "not eval_golden and not eval_redteam"
